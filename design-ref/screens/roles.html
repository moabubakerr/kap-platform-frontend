<sc-if value="{{ s.roles }}"><div style="padding:12px 32px 48px;display:flex;flex-direction:column;gap:16px;max-width:1440px">
<div style="display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap"><div style="flex:1;min-width:280px"><h1 style="margin:0;font-size:24px;font-weight:600;color:var(--text-strong)">Roles</h1><p style="margin:4px 0 0;color:var(--text-muted)">Permission bundles. Roles are assigned to groups through access grants.</p></div><div style="display:flex;gap:8px;flex-wrap:wrap;align-items:center"><x-import component-from-global-scope="SingleWindowDesignSystem_3a0998.Button" size="sm" icon-left="{{ ic.plus }}" hint-size="120px,34px">Create role</x-import></div></div>
<div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr));gap:12px"><sc-for list="{{ roles }}" as="r"><div style="background:var(--surface-card);border:1px solid var(--border-subtle);border-radius:var(--r-card);padding:16px;display:flex;flex-direction:column;gap:12px"><div style="display:flex;gap:10px;align-items:center"><span style="width:32px;height:32px;border-radius:var(--r-sm);background:var(--brand-tint);color:var(--brand);display:grid;place-items:center">{{ ic.shield }}</span><div><div style="font-family:var(--font-mono);font-size:12.5px;font-weight:600;color:var(--text-strong);font-size:14px">{{ r.n }}</div><div style="font-size:12px;color:var(--text-muted)">{{ r.g }}</div></div></div><div style="font-size:13px;color:var(--text-muted)">{{ r.d }}</div><div style="display:flex;flex-direction:column;border-top:1px solid var(--border-subtle)"><sc-for list="{{ r.perms }}" as="p"><div style="display:flex;justify-content:space-between;align-items:center;padding:6px 0;border-bottom:1px solid var(--border-subtle);font-size:12.5px"><span style="font-family:var(--font-mono);color:{{ p.fg }}">{{ p.p }}</span><span style="color:{{ p.c }};display:flex">{{ p.icon }}</span></div></sc-for></div></div></sc-for></div>
</div></sc-if>
