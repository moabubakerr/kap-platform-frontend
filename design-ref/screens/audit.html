<sc-if value="{{ s.audit }}"><div style="padding:12px 32px 48px;display:flex;flex-direction:column;gap:16px;max-width:1440px">
<div style="display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap"><div style="flex:1;min-width:280px"><h1 style="margin:0;font-size:24px;font-weight:600;color:var(--text-strong)">Audit log</h1><p style="margin:4px 0 0;color:var(--text-muted)">Who changed what, and when, across SCEAI resources.</p></div><div style="display:flex;gap:8px;flex-wrap:wrap;align-items:center"><x-import component-from-global-scope="SingleWindowDesignSystem_3a0998.Button" size="sm" variant="outline" icon-left="{{ ic.download }}" hint-size="100px,34px">Export</x-import></div></div>
<div style="display:flex;gap:8px;flex-wrap:wrap"><span style="display:flex;align-items:center;gap:6px;height:30px;padding:0 12px;border:1px solid var(--border-default);border-radius:var(--r-sm);background:var(--surface-card);font-size:13px;white-space:nowrap">Who: anyone{{ ic.chev }}</span><span style="display:flex;align-items:center;gap:6px;height:30px;padding:0 12px;border:1px solid var(--border-default);border-radius:var(--r-sm);background:var(--surface-card);font-size:13px;white-space:nowrap">Resource type: any{{ ic.chev }}</span><span style="display:flex;align-items:center;gap:6px;height:30px;padding:0 12px;border:1px solid var(--brand);border-radius:var(--r-sm);background:var(--brand-tint);color:var(--brand-strong);font-size:13px;white-space:nowrap;font-weight:500">Last 30 days{{ ic.chev }}</span></div>
<div style="background:var(--surface-card);border:1px solid var(--border-subtle);border-radius:var(--r-card);padding:8px 0"><sc-for list="{{ audit }}" as="a"><div style="display:grid;grid-template-columns:120px 20px minmax(0,1fr);gap:12px;padding:12px 16px"><div style="font-size:12.5px;color:var(--text-muted);text-align:right" title="{{ a.abs }}">{{ a.when }}</div><div style="display:flex;flex-direction:column;align-items:center"><span style="width:10px;height:10px;border-radius:50%;background:{{ a.c }};margin-top:4px"></span><span style="flex:1;width:1px;background:var(--border-subtle);margin-top:4px"></span></div><div style="min-width:0"><div style="font-size:13.5px"><span style="font-family:var(--font-mono);font-size:12.5px;font-weight:600">{{ a.who }}</span> {{ a.action }} <a href="#" style="font-family:var(--font-mono);font-size:12.5px">{{ a.res }}</a></div><div style="font-size:12px;color:var(--text-muted)">{{ a.meta }}</div><sc-if value="{{ a.open }}"><div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:8px;margin-top:10px;font-family:var(--font-mono);font-size:12px"><div style="padding:8px 10px;border-radius:var(--r-sm);background:var(--danger-bg)"><div style="font-family:var(--font-sans);font-size:11.5px;font-weight:600;color:var(--danger-fg);margin-bottom:4px">Before</div>{{ a.before }}</div><div style="padding:8px 10px;border-radius:var(--r-sm);background:var(--success-bg)"><div style="font-family:var(--font-sans);font-size:11.5px;font-weight:600;color:var(--success-fg);margin-bottom:4px">After</div>{{ a.after }}</div></div></sc-if></div></div></sc-for></div>
</div></sc-if>
