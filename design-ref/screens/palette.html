<sc-if value="{{ palette }}"><div style="position:fixed;left:50%;top:80px;transform:translateX(-50%);width:640px;max-width:calc(100vw - 32px);z-index:80;background:var(--surface-card);border:1px solid var(--border-subtle);border-radius:6px;box-shadow:var(--shadow-xl);overflow:hidden">
  <div style="display:flex;align-items:center;gap:10px;padding:14px 16px;border-bottom:1px solid var(--border-subtle);color:var(--text-muted)">{{ ic.search }}<span style="flex:1;font-size:15px;color:var(--text-strong)">sceai<span style="display:inline-block;width:1.5px;height:17px;background:var(--brand);vertical-align:-3px;margin-left:1px"></span></span><span style="font-family:var(--font-mono);font-size:11px;padding:2px 6px;border:1px solid var(--border-default);border-radius:var(--r-card)">Esc</span></div>
  <div style="padding:6px;max-height:420px;overflow:auto"><sc-for list="{{ palItems }}" as="p"><sc-if value="{{ p.head }}"><div style="padding:8px 10px 4px;font-size:11px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--text-subtle)">{{ p.head }}</div></sc-if><div sc-camel-on-click="{{ p.go }}" style="display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:var(--r-sm);background:{{ p.bg }};cursor:pointer" style-hover="background:var(--surface-hover)"><span style="color:var(--text-muted);display:flex">{{ p.icon }}</span><span style="font-family:{{ p.f }};font-size:13.5px;color:var(--text-strong);white-space:nowrap">{{ p.n }}</span><span style="font-size:12px;color:var(--text-muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:1">{{ p.d }}</span><span style="font-size:11.5px;color:var(--text-subtle);white-space:nowrap">{{ p.k }}</span></div></sc-for></div>
  <div style="display:flex;gap:16px;padding:8px 16px;border-top:1px solid var(--border-subtle);font-size:11.5px;color:var(--text-subtle);background:var(--surface-sunken)"><span>Enter to open</span><span>Up and down to move</span><span>Search by name or ID</span></div>
</div></sc-if>
